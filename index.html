<style>

body.intro-lock{height:100vh;overflow:hidden}

#world{
  position:fixed;

  pointer-events:none;
}

  display:block;

}
#shade{
  position:fixed;
  inset:0;

  background:
    radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.28) 100%),

}
#noise{
  position:fixed;
  inset:0;
  z-index:3;
  opacity:.08;
  pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}
#intro{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#03040a;
  transition:opacity 1.5s ease,visibility 1.5s ease;
}
#intro.exit{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.intro-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(72,46,148,.26),transparent 42%),
    radial-gradient(ellipse at 50% 85%,rgba(0,155,210,.15),transparent 48%),
    #03040a;
}
.intro-bg:before{
  content:"";
  position:absolute;
  width:min(100vw,900px);
  aspect-ratio:1;
  border-radius:50%;
  border:1px solid rgba(150,130,255,.3);
  top:42%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:
    0 0 50px rgba(120,100,255,.16),
    inset 0 0 80px rgba(0,220,255,.08);
  animation:portalA 22s linear infinite;
}
.intro-bg:after{
  content:"";
  position:absolute;
  width:min(70vw,650px);
  aspect-ratio:1;
  border-radius:50%;
  border:1px solid rgba(0,220,255,.3);
  top:42%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 0 60px rgba(0,200,255,.13);
  animation:portalB 16s linear infinite;
}
@keyframes portalA{
  from{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(0)}
  to{transform:translate(-50%,-50%) rotateX(68deg) rotateZ(360deg)}
}
@keyframes portalB{
  from{transform:translate(-50%,-50%) rotateY(65deg) rotateZ(360deg)}
  to{transform:translate(-50%,-50%) rotateY(65deg) rotateZ(0)}
}
.portal-hole{
  position:absolute;
  left:50%;
  top:42%;
  width:min(35vw,330px);
  aspect-ratio:1;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,
    #010107 0 20%,
    #1d153b 27%,
    #6942b6 32%,
    #16c5e7 36%,
    #17112e 42%,
    transparent 68%);
  filter:blur(2px);
  box-shadow:0 0 110px rgba(0,194,255,.18),0 0 160px rgba(132,70,255,.22);
  animation:holePulse 5s ease-in-out infinite alternate;
}
@keyframes holePulse{
  from{transform:translate(-50%,-50%) scale(.9);filter:hue-rotate(0deg) blur(2px)}
  to{transform:translate(-50%,-50%) scale(1.12);filter:hue-rotate(60deg) blur(5px)}
}
.orbit{
  position:absolute;
  width:min(105vw,950px);
  aspect-ratio:1;
  left:50%;top:42%;
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
  transform:translate(-50%,-50%);
  animation:orbitSpin 35s linear infinite;
}
.orbit:before,.orbit:after{
  content:"";
  position:absolute;
  width:7px;height:7px;
  border-radius:50%;
  background:#b49bff;
  box-shadow:0 0 28px 8px rgba(140,100,255,.65);
  left:16%;top:24%;
}
.orbit:after{
  left:78%;top:72%;
  background:#63eaff;
  box-shadow:0 0 25px 8px rgba(0,220,255,.55);
}
@keyframes orbitSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}

.end-section{

<script type="module">
import * as THREE from 'three';
import { gsap } from 'https://esm.sh/gsap@3.12.5';
import { ScrollTrigger } from 'https://esm.sh/gsap@3.12.5/ScrollTrigger';

gsap.registerPlugin(ScrollTrigger);

/* =========================================
   CORE ENGINE
========================================= */

const host=document.querySelector('#world');
const sections=[...document.querySelectorAll('.scene')];
const counter=document.querySelector('#counter');
const intro=document.querySelector('#intro');
const experience=document.querySelector('#experience');
const hud=document.querySelector('#hud');
const hint=document.querySelector('#scroll-hint');
const music=document.querySelector('#music');
const soundButton=document.querySelector('#sound');

const mobile=matchMedia('(max-width:700px)').matches;
const quality=mobile?0.55:1;
const particleScale=mobile?0.48:1;

const renderer=new THREE.WebGLRenderer({
  antialias:!mobile,
  alpha:false,
  powerPreference:'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,mobile?1.35:1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.3;
host.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x03040a);
scene.fog=new THREE.FogExp2(0x03040a,.025);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,180);
camera.position.set(0,0,10);

const ambient=new THREE.AmbientLight(0xffffff,1.2);
scene.add(ambient);

const lightA=new THREE.PointLight(0x8c76ff,100,60);
lightA.position.set(5,6,8);
scene.add(lightA);

const lightB=new THREE.PointLight(0x00d9ff,90,60);
lightB.position.set(-6,-3,-5);
scene.add(lightB);

const lightC=new THREE.PointLight(0xff8bc8,45,40);
lightC.position.set(0,5,-7);
scene.add(lightC);

const world=new THREE.Group();
scene.add(world);

let active=-1;
let clock=0;
let progress=0;
let updateScene=()=>{};
let objects=[];
let soundEnabled=true;
let targetCamera=new THREE.Vector3(0,0,9.5);
let targetLook=new THREE.Vector3(0,0,0);

const palettes=[
 [0x8068ff,0x00dfff,0xe7dcff],
 [0xff75bb,0xffd2e9,0x9b72ff],
 [0x00d9ff,0x176dff,0xf0ffff],
 [0xff8c55,0xffcf76,0xff548c],
 [0x76e9ff,0x547bff,0xe8ffff],
 [0xb38bff,0x6c55ff,0xf3eaff],
 [0x7affc6,0x2d9d87,0xd6fff1],
 [0xffd0a0,0xff7c87,0xffffff],
 [0x7cfff2,0x6c9aff,0xffffff],
 [0xff86bd,0x76dcff,0xffffff],
 [0xa4cfff,0xffffff,0x9d91ff],
 [0xc5a1ff,0x6e4cff,0xffffff],
 [0xa6ff8e,0x4ad9a5,0xffffff],
 [0xffb06c,0xff647c,0xffe7a0],
 [0x9ca9ff,0x5b6bff,0xffffff],
 [0xe9e9ee,0x8b8d99,0xffffff],
 [0xffa8df,0x9276ff,0xffffff],
 [0x75eaff,0x6e7cff,0xffffff],
 [0xffd37a,0xff8a65,0xffffff],
 [0x90b7ff,0xd6efff,0xffffff],
 [0xff91ad,0xa47aff,0xffffff],
 [0x80edff,0xffd16c,0xffffff],
 [0xbaff8d,0x79baff,0xffffff],
 [0xff9c70,0xb78bff,0xffffff],
 [0x9baaff,0x52e6ff,0xffffff]
];

function register(obj){
  world.add(obj);
  objects.push(obj);
  return obj;
}
function material(color,metalness=.45,roughness=.22,emissive=0x000000){
  return new THREE.MeshPhysicalMaterial({
    color,
    metalness,
    roughness,
    emissive,
    emissiveIntensity:.45,
    clearcoat:.9,
    clearcoatRoughness:.12
  });
}
function mesh(geometry,mat,x=0,y=0,z=0){
  const m=new THREE.Mesh(geometry,mat);
  m.position.set(x,y,z);
  return register(m);
}
function line(points,color,opacity=.7){
  const geometry=new THREE.BufferGeometry().setFromPoints(points);
  const m=new THREE.Line(geometry,new THREE.LineBasicMaterial({
    color,transparent:true,opacity
  }));
  return register(m);
}
function points(count,color,size=.03,spread=8,mode='random'){
  count=Math.floor(count*particleScale);
  const positions=new Float32Array(count*3);
  const seeds=new Float32Array(count);
  for(let i=0;i<count;i++){
    let x,y,z;
    if(mode==='sphere'){
      const u=Math.random()*Math.PI*2;
      const v=Math.acos(2*Math.random()-1);
      const r=spread*(.55+Math.random()*.45);
      x=r*Math.sin(v)*Math.cos(u);
      y=r*Math.sin(v)*Math.sin(u);
      z=r*Math.cos(v);
    }else if(mode==='ring'){
      const a=Math.random()*Math.PI*2;
      const r=spread*(.65+Math.random()*.35);
      x=Math.cos(a)*r;
      y=(Math.random()-.5)*1.4;
      z=Math.sin(a)*r;
    }else if(mode==='rain'){
      x=(Math.random()-.5)*spread;
      y=(Math.random()-.5)*spread*2;
      z=(Math.random()-.5)*spread;
    }else{
      x=(Math.random()-.5)*spread*2;
      y=(Math.random()-.5)*spread*2;
      z=(Math.random()-.5)*spread*2;
    }
    positions[i*3]=x;
    positions[i*3+1]=y;
    positions[i*3+2]=z;
    seeds[i]=Math.random()*10;
  }
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geometry.setAttribute('seed',new THREE.BufferAttribute(seeds,1));
  const p=new THREE.Points(geometry,new THREE.PointsMaterial({
    color,size,
    transparent:true,
    opacity:.88,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  }));
  return register(p);
}
function clearWorld(){
  while(world.children.length){
    const obj=world.children[0];
    world.remove(obj);
    obj.traverse?.(child=>{
      if(child.geometry)child.geometry.dispose();
      if(child.material){
        if(Array.isArray(child.material)){
          child.material.forEach(m=>m.dispose());
        }else child.material.dispose();
      }
    });
  }
  objects=[];
}
function setPalette(index){
  const p=palettes[index];
  lightA.color.setHex(p[0]);
  lightB.color.setHex(p[1]);
  lightC.color.setHex(p[2]);
}
function sphere(radius,color,detail=2){
  return mesh(
    new THREE.IcosahedronGeometry(radius,detail),
    material(color,.65,.18,color)
  );
}
function torus(radius,tube,color,rotation=[0,0,0]){
  const m=mesh(
    new THREE.TorusGeometry(radius,tube,12,160),
    new THREE.MeshBasicMaterial({color,transparent:true,opacity:.85})
  );
  m.rotation.set(...rotation);
  return m;
}
function setSceneCamera(z=9.5,x=0,y=0){
  targetCamera.set(x,y,z);
}

/* =========================================
   SCENE 01 — DIMENSIONAL PORTAL
========================================= */

function scene01(){
  points(1800,0x9b9aff,.035,11,'sphere');
  const core=sphere(1.25,0x8d7aff,3);
  const wire=mesh(
    new THREE.IcosahedronGeometry(2.1,2),
    new THREE.MeshBasicMaterial({color:0x5ceaff,wireframe:true})
  );
  const rings=[];
  for(let i=0;i<9;i++){
    const r=torus(2.5+i*.17,.012,i%2?0x00dfff:0xa78bff);
    r.rotation.set(i*.22,i*.35,i*.18);
    rings.push(r);
  }
  setSceneCamera(10);
  return t=>{
    core.rotation.y=t*.25;
    core.scale.setScalar(1+Math.sin(t*1.2)*.06);
    wire.rotation.x=t*.18;
    wire.rotation.y=-t*.2;
    rings.forEach((r,i)=>{
      r.rotation.z+=.0007*(i%2?1:-1);
      r.rotation.x+=.0003;
    });
  };
}

/* =========================================
   SCENE 02 — DIGITAL EDEN
========================================= */

function scene02(){
  const petals=[];
  for(let i=0;i<48;i++){
    const a=i*Math.PI*2/48;
    const p=mesh(
      new THREE.SphereGeometry(1,24,18),
      material(i%2?0xff82c3:0xb08cff,.28,.2,0x531b60)
    );
    p.scale.set(.27,1.05,.12);
    p.position.set(Math.cos(a)*1.15,Math.sin(a)*1.15,Math.sin(i*.4)*.18);
    p.rotation.z=a-Math.PI/2;
    petals.push(p);
  }
  const center=mesh(
    new THREE.SphereGeometry(.45,40,40),
    material(0xffe1a8,.5,.18,0x9a5721)
  );
  points(700,0xffa8df,.025,5,'sphere');
  setSceneCamera(9.5);
  return t=>{
    world.rotation.z=Math.sin(t*.2)*.15;
    petals.forEach((p,i)=>{
      const a=i*Math.PI*2/48;
      p.scale.y=1.05+Math.sin(t*1.4+i*.15)*.16;
      p.position.z=Math.sin(t+i*.2)*.16;
      p.rotation.z=a-Math.PI/2+Math.sin(t*.4)*.08;
    });
    center.scale.setScalar(1+Math.sin(t*2)*.08);
  };
}

/* =========================================
   SCENE 03 — LIQUID DIMENSION
========================================= */

function scene03(){
  const geometry=new THREE.SphereGeometry(2.1,100,80);
  const shader=new THREE.ShaderMaterial({
    uniforms:{
      time:{value:0},
      colorA:{value:new THREE.Color(0x00dfff)},
      colorB:{value:new THREE.Color(0x825dff)}
    },
    vertexShader:`
      uniform float time;
      varying vec3 vPos;
      varying vec3 vNormal;
      void main(){
        vPos=position;
        vNormal=normal;
        vec3 p=position;
        float wave=sin(p.x*2.0+time)*0.09+
                   cos(p.y*2.5-time*0.7)*0.1+
                   sin(p.z*3.0+time*0.8)*0.07;
        p+=normal*wave;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
      }
    `,
    fragmentShader:`
      uniform float time;
      uniform vec3 colorA;
      uniform vec3 colorB;
      varying vec3 vPos;
      varying vec3 vNormal;
      void main(){
        float f=sin(vPos.x*2.5+time)*cos(vPos.y*2.0-time);
        float edge=pow(1.0-abs(dot(normalize(vNormal),vec3(0.0,0.0,1.0))),2.0);
        vec3 c=mix(colorA,colorB,smoothstep(-.6,.8,f));
        c+=edge*.65;
        gl_FragColor=vec4(c,1.0);
      }
    `
  });
  const liquid=mesh(geometry,shader);
  points(900,0x62eaff,.025,7,'sphere');
  setSceneCamera(8.5);
  return t=>{
    shader.uniforms.time.value=t;
    liquid.rotation.y=t*.15;
    liquid.rotation.x=Math.sin(t*.3)*.15;
  };
}

    const endY=y+Math.cos(angle)*length;
    const start=new THREE.Vector3(x,y,z);
    const end=new THREE.Vector3(endX,endY,z);
    line([start,end],depth%2?0x9c83ff:0x68eaff,.75);
    branch(endX,endY,z,length*.72,angle-.55,depth-1);
    branch(endX,endY,z,length*.72,angle+.55,depth-1);
    if(depth>2)branch(endX,endY,z,length*.58,angle+.08,depth-2);
  };

/* =========================================
   SCENE MANAGER
========================================= */

function loadScene(index){
  if(index===active)return;
  active=index;
  clearWorld();
  setPalette(index);
  progress=0;

  const next=builders[index]();
  updateScene=typeof next==='function'?next:()=>{};

  counter.textContent=
    String(index+1).padStart(2,'0')+' / 25';

  gsap.fromTo(world.scale,
    {x:.7,y:.7,z:.7},
    {x:1,y:1,z:1,duration:1.4,ease:'power3.out'}
  );

  gsap.fromTo(camera.position,
    {z:12},
    {z:9.5,duration:1.6,ease:'power3.out'}
  );
}

sections.forEach((section,index)=>{
  ScrollTrigger.create({
    trigger:section,
    start:'top 55%',
    end:'bottom 45%',
    onEnter:()=>loadScene(index),
    onEnterBack:()=>loadScene(index)
  });

  ScrollTrigger.create({
    trigger:section,
    start:'top bottom',
    end:'bottom top',
    onUpdate:self=>{
      if(index===active){
        progress=self.progress;
      }
    }
  });
});

/* =========================================
   SCROLL CAMERA CHOREOGRAPHY
========================================= */

sections.forEach((section,index)=>{
  ScrollTrigger.create({
    trigger:section,
    start:'top bottom',
    end:'bottom top',
    onUpdate:self=>{
      if(index!==active)return;
      const p=self.progress;
      targetCamera.z=9.5-p*.8;
      targetCamera.x=Math.sin(p*Math.PI*2)*.55;
      targetCamera.y=Math.cos(p*Math.PI*2)*.28;
      targetLook.x=Math.sin(p*Math.PI)*.15;
      targetLook.y=Math.cos(p*Math.PI)*.1;
    }
  });
});

/* =========================================
   RENDER LOOP
========================================= */

let previous=0;
function render(ms){
  requestAnimationFrame(render);
  const dt=Math.min((ms-previous)/1000,.05);
  previous=ms;
  clock+=dt;

  if(active>=0){
    updateScene(clock,progress);

    camera.position.x=THREE.MathUtils.damp(
      camera.position.x,targetCamera.x,2.4,dt
    );
    camera.position.y=THREE.MathUtils.damp(
      camera.position.y,targetCamera.y,2.4,dt
    );
    camera.position.z=THREE.MathUtils.damp(
      camera.position.z,targetCamera.z,2.4,dt
    );

    camera.lookAt(targetLook);
    world.position.y=Math.sin(clock*.3)*.035;
  }

  renderer.render(scene,camera);
}
requestAnimationFrame(render);

/* =========================================
   INTRO & AUDIO
========================================= */

document.querySelector('#enter').addEventListener('click',async()=>{
  intro.classList.add('exit');
  document.body.classList.remove('intro-lock');
  experience.classList.add('visible');
  hud.classList.add('show');
  hint.classList.add('show');

  if(soundEnabled){
    try{
      music.volume=.55;
      await music.play();
      soundButton.textContent='SOUND ON';
    }catch(error){
      soundButton.textContent='SOUND OFF';
    }
  }

  setTimeout(()=>{
    window.scrollTo({top:0,behavior:'auto'});
    ScrollTrigger.refresh();
    loadScene(0);
  },300);
});

soundButton.addEventListener('click',async()=>{
  if(music.paused){
    try{
      await music.play();
      soundButton.textContent='SOUND ON';
    }catch(error){
      soundButton.textContent='SOUND OFF';
    }
  }else{
    music.pause();
    soundButton.textContent='SOUND OFF';
  }
});

/* =========================================
   RESPONSIVE RESIZE
========================================= */

function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(
    Math.min(devicePixelRatio||1,mobile?1.35:1.8)
  );
  renderer.setSize(innerWidth,innerHeight);
  ScrollTrigger.refresh();
}
window.addEventListener('resize',resize);

/* =========================================
   KEYBOARD NAVIGATION
========================================= */

window.addEventListener('keydown',e=>{
  if(document.body.classList.contains('intro-lock'))return;

  if(e.key==='ArrowDown'||e.key==='PageDown'){
    e.preventDefault();
    window.scrollBy({top:innerHeight*.85,behavior:'smooth'});
  }
  if(e.key==='ArrowUp'||e.key==='PageUp'){
    e.preventDefault();
    window.scrollBy({top:-innerHeight*.85,behavior:'smooth'});
  }
});

/* =========================================
   END EXPERIENCE
========================================= */

const endSection=document.querySelector('.end-section');
ScrollTrigger.create({
  trigger:endSection,
  start:'top 65%',
  onEnter:()=>{
    counter.textContent='25 / 25';
    hint.textContent='THE JOURNEY CONTINUES';
  },
  onLeaveBack:()=>{
    hint.textContent='SCROLL TO EXPLORE';
  }
});
</script>
</body>
