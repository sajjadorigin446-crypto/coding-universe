<style>
:root {
  --black:#030303;
  --gold:#c6a467;
  --ivory:#eee8dc;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html {
  background:var(--black);
  scroll-behavior:smooth;
  scrollbar-width:thin;
  scrollbar-color:#8e7040 #030303;
}

body {
  background:var(--black);
  color:var(--ivory);
  font-family:Inter,sans-serif;
  overflow-x:hidden;
}

body.intro-open {
  overflow:hidden;
}

button {
  font:inherit;
}

/* 3D WORLD */

#world {
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
}

#world canvas {
  display:block;
  width:100%;
  height:100%;
}

.vignette {
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.38) 100%),
    linear-gradient(180deg,rgba(0,0,0,.12),transparent 35%,rgba(0,0,0,.25));
}

/* INTRO */

#intro {
  position:fixed;
  inset:0;
  z-index:20;
  display:grid;
  place-items:center;
  text-align:center;
  overflow:hidden;
  background:#030303;
  transition:opacity 1.2s ease,visibility 1.2s ease;
}

#intro.exit {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.intro-orbit {
  position:absolute;
  width:min(75vw,620px);
  aspect-ratio:1;
  border:1px solid rgba(198,164,103,.22);
  border-radius:50%;
  box-shadow:
    0 0 80px rgba(198,164,103,.05),
    inset 0 0 80px rgba(198,164,103,.035);
  animation:orbit 35s linear infinite;
}

.intro-orbit::before,
.intro-orbit::after {
  content:"";
  position:absolute;
  inset:9%;
  border:1px dashed rgba(198,164,103,.23);
  border-radius:50%;
}

.intro-orbit::after {
  inset:20%;
  border-style:solid;
  border-color:rgba(198,164,103,.13);
  animation:orbit 20s linear infinite reverse;
}

.intro-light {
  position:absolute;
  width:60vw;
  max-width:600px;
  aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(circle,rgba(180,133,66,.13),transparent 68%);
  filter:blur(25px);
  animation:pulse 5s ease-in-out infinite;
}

.intro-content {
  position:relative;
  z-index:3;
  padding:24px;
}

.intro-kicker {
  font-size:9px;
  letter-spacing:6px;
  color:var(--gold);
  margin-bottom:28px;
}

.intro-title {
  font-family:Cinzel,serif;
  font-size:clamp(32px,7vw,78px);
  font-weight:400;
  letter-spacing:3px;
  line-height:1.25;
}

.intro-title span {
  display:block;
  color:var(--gold);
}

.intro-subtitle {
  margin-top:20px;
  font-size:10px;
  letter-spacing:4px;
  color:#898174;
}

.enter {
  margin-top:48px;
  padding:17px 35px;
  border:1px solid rgba(198,164,103,.65);
  background:rgba(198,164,103,.04);
  color:#e5cb99;
  letter-spacing:4px;
  font-size:9px;
  cursor:pointer;
  transition:.4s;
}

.enter:hover {
  background:var(--gold);
  color:#080706;
  box-shadow:0 0 40px rgba(198,164,103,.25);
}

.intro-footer {
  position:absolute;
  bottom:27px;
  color:#655c4d;
  font-size:8px;
  letter-spacing:4px;
}

/* MAIN INTERFACE */

#main {
  position:relative;
  z-index:3;
  opacity:0;
  visibility:hidden;
  transition:opacity 1.2s ease;
}

#main.show {
  opacity:1;
  visibility:visible;
}

.brand-mark {
  position:fixed;
  top:27px;
  left:35px;
  z-index:8;
  font-family:Cinzel,serif;
  font-size:12px;
  letter-spacing:3px;
  color:rgba(222,190,133,.85);
  mix-blend-mode:screen;
  pointer-events:none;
}

.scene-counter {
  position:fixed;
  right:35px;
  bottom:32px;
  z-index:8;
  font-size:9px;
  letter-spacing:3px;
  color:rgba(220,194,149,.8);
  pointer-events:none;
}

.scene-counter span {
  color:#777064;
}

.sound {
  position:fixed;
  right:30px;
  top:22px;
  z-index:10;
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 13px;
  color:#d5bb8b;
  background:rgba(5,5,5,.55);
  border:1px solid rgba(198,164,103,.25);
  font-size:8px;
  letter-spacing:2px;
  cursor:pointer;
  backdrop-filter:blur(10px);
}

.sound-bars {
  display:flex;
  align-items:center;
  gap:3px;
  height:12px;
}

.sound-bars i {
  width:2px;
  height:4px;
  background:var(--gold);
}

.sound.playing .sound-bars i {
  animation:bars .65s ease-in-out infinite alternate;
}

.sound-bars i:nth-child(2) {animation-delay:.15s}
.sound-bars i:nth-child(3) {animation-delay:.3s}
.sound-bars i:nth-child(4) {animation-delay:.1s}

.scroll-hint {
  position:fixed;
  bottom:32px;
  left:35px;
  z-index:8;
  color:rgba(205,190,164,.55);
  font-size:8px;
  letter-spacing:3px;
  pointer-events:none;
  writing-mode:vertical-rl;
}

.scroll-hint::after {
  content:"";
  display:block;
  height:42px;
  width:1px;
  margin:15px auto 0;
  background:linear-gradient(var(--gold),transparent);
}

/* SCROLL WORLD */

.world-section {
  height:100svh;
  min-height:600px;
  position:relative;
  z-index:0;
  pointer-events:none;
}

.world-section:first-child {
  height:100svh;
}

.world-section:last-child {
  height:100svh;
}

.end-mark {
  position:relative;
  z-index:4;
  height:100svh;
  display:grid;
  place-items:center;
  text-align:center;
  pointer-events:none;
}

.end-mark div {
  font-family:Cinzel,serif;
  font-size:clamp(20px,4vw,45px);

  color:rgba(204,170,112,.65);
}

.end-mark small {
  display:block;
  margin-top:22px;
  font-family:Inter,sans-serif;
  font-size:8px;
  letter-spacing:5px;
  color:#777064;

/* RESPONSIVE */

@keyframes orbit {
  to {transform:rotate(360deg)}
}

@keyframes pulse {
  0%,100% {transform:scale(.85);opacity:.55}
  50% {transform:scale(1.15);opacity:1}
}

@keyframes bars {
  from {height:3px}

@media(max-width:700px) {
  .brand-mark {

  .intro-kicker {

  .intro-subtitle {

  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {

{
  "imports": {

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================
   RENDERER
========================================= */

const container = document.getElementById('world');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030303);
scene.fog = new THREE.FogExp2(0x030303,0.018);

const camera = new THREE.PerspectiveCamera(
  42,
  innerWidth/innerHeight,
  0.1,
  150
);

camera.position.set(0,0,10);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:false,
  powerPreference:'high-performance'
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
container.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth,innerHeight),
  0.85,
  0.65,
  0.12
);

composer.addPass(bloom);
composer.addPass(new OutputPass());

/* =========================================
   LIGHTING
========================================= */

scene.add(new THREE.AmbientLight(0x8c795d,1.1));

const keyLight = new THREE.PointLight(0xe1b86f,100,40);
keyLight.position.set(4,4,6);
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x78532d,75,35);
rimLight.position.set(-5,-3,-5);
scene.add(rimLight);

const topLight = new THREE.PointLight(0xffd9a0,35,25);
topLight.position.set(0,6,2);
scene.add(topLight);

/* =========================================
   MATERIALS
========================================= */

const gold = new THREE.MeshStandardMaterial({
  color:0xb18a4e,
  metalness:.95,
  roughness:.19,
  emissive:0x291706,
  emissiveIntensity:.5
});

const blackMetal = new THREE.MeshStandardMaterial({
  color:0x11100f,
  metalness:.96,
  roughness:.16
});

const bronze = new THREE.MeshStandardMaterial({
  color:0x74552f,
  metalness:.9,
  roughness:.28
});

const crystal = new THREE.MeshPhysicalMaterial({
  color:0x5b4932,
  metalness:.55,
  roughness:.1,
  transmission:.15,
  thickness:1.2,
  clearcoat:1,
  clearcoatRoughness:.08
});

const glow = new THREE.MeshBasicMaterial({
  color:0xf0cb84
});

/* =========================================
   HELPERS
========================================= */

let activeGroup = new THREE.Group();
scene.add(activeGroup);

let activeScene = '';
let elapsed = 0;

let pointerX = 0;
let pointerY = 0;
let smoothX = 0;
let smoothY = 0;

function mesh(parent,geometry,material,x=0,y=0,z=0) {
  const object = new THREE.Mesh(geometry,material);
  object.position.set(x,y,z);
  parent.add(object);
  return object;
}

function torus(parent,radius,tube,material=gold) {
  return mesh(
    parent,
    new THREE.TorusGeometry(radius,tube,12,128),
    material
  );
}

function particles(parent,count,spread,size=.025) {
  const positions = new Float32Array(count*3);

  for(let i=0;i<count;i++) {
    positions[i*3]=(Math.random()-.5)*spread;
    positions[i*3+1]=(Math.random()-.5)*spread;
    positions[i*3+2]=(Math.random()-.5)*spread;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    'position',
    new THREE.BufferAttribute(positions,3)
  );

  const material = new THREE.PointsMaterial({
    color:0xc6a467,
    size,
    transparent:true,
    opacity:.72,
    sizeAttenuation:true,
    depthWrite:false
  });

  const points = new THREE.Points(geometry,material);
  parent.add(points);

  return points;
}

function resetGroup() {
  scene.remove(activeGroup);

  activeGroup.traverse(object=>{
    if(object.geometry) object.geometry.dispose();

    if(object.material) {
      if(Array.isArray(object.material)) {
        object.material.forEach(m=>m.dispose());
      } else {
        object.material.dispose();
      }
    }
  });

  activeGroup = new THREE.Group();
  scene.add(activeGroup);
}

/* =========================================
   01 — INFINITE GEOMETRY
   Exploding procedural cube structure
========================================= */

function geometryScene() {
  const group = new THREE.Group();

  const core = new THREE.Group();
  group.add(core);

  const central = mesh(
    core,
    new THREE.IcosahedronGeometry(.85,2),
    blackMetal
  );

  const wire = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1.15,2),
    new THREE.MeshBasicMaterial({
      color:0xc6a467,
      wireframe:true,
      transparent:true,
      opacity:.55
    })
  );

  core.add(wire);

  const blocks = [];

  for(let i=0;i<150;i++) {
    const size=.07+Math.random()*.2;

    const block=mesh(
      core,
      new THREE.BoxGeometry(size,size,size),
      i%4===0?gold:blackMetal
    );

    const direction = new THREE.Vector3(
      Math.random()-.5,
      Math.random()-.5,
      Math.random()-.5
    ).normalize();

    blocks.push({
      object:block,
      direction,
      distance:1.5+Math.random()*3,
      speed:.6+Math.random()*1.4,
      phase:Math.random()*6.28
    });
  }

  const ringA=torus(group,2.8,.014);
  const ringB=torus(group,3.4,.009,bronze);
  const ringC=torus(group,4,.008);

  ringA.rotation.x=1.1;
  ringB.rotation.y=.8;
  ringC.rotation.x=-.7;

  const dust=particles(group,1000,18,.018);

  return {
    group,
    update(t) {
      core.rotation.x=t*.23;
      core.rotation.y=t*.32;

      const explosion=(Math.sin(t*.9)+1)/2;

      central.scale.setScalar(1+explosion*.12);

      blocks.forEach(b=>{
        const amount=b.distance*(.15+explosion*.85);

        b.object.position.copy(
          b.direction.clone().multiplyScalar(amount)
        );

        b.object.rotation.x=t*b.speed+b.phase;
        b.object.rotation.y=t*b.speed*.8;
      });

      ringA.rotation.z=t*.2;
      ringB.rotation.x=t*.18;
      ringC.rotation.y=t*.12;

      dust.rotation.y=-t*.025;
    }
  };
}

/* =========================================
   02 — DIGITAL BLOOM
   Procedural flower
========================================= */

function bloomScene() {
  const group = new THREE.Group();
  const flower = new THREE.Group();
  group.add(flower);

  const stem = mesh(
    flower,
    new THREE.CylinderGeometry(.045,.075,3,16),
    blackMetal,
    0,-1.15,0
  );

  stem.rotation.z=-.12;

  const petals=[];

  for(let layer=0;layer<3;layer++) {
    const count=18;

    for(let i=0;i<count;i++) {
      const angle=(i/count)*Math.PI*2;
      const petal=mesh(
        flower,
        new THREE.SphereGeometry(1,32,24),
        layer===1?gold:crystal
      );

      petal.scale.set(.22,.9,.105);
      petal.position.set(0,.15,0);
      petal.rotation.z=-Math.PI/2;
      petal.rotation.y=angle;

      petals.push({
        object:petal,
        angle,
        layer,
        offset:Math.random()*6.28
      });
    }
  }

  const center=mesh(
    flower,
    new THREE.SphereGeometry(.34,40,40),
    glow,
    0,.2,0
  );

  const coreRing=torus(group,2.3,.014);
  coreRing.rotation.x=1.3;

  const dust=particles(group,700,12,.018);

  return {
    group,
    update(t) {
      flower.rotation.y=t*.16;

      petals.forEach(p=>{
        const opening=(Math.sin(t*.75+p.offset*.08)+1)/2;
        const angle=p.angle;
        const radius=.2+opening*(.55+p.layer*.35);

        p.object.position.set(
          Math.cos(angle)*radius,
          .15-p.layer*.08,
          Math.sin(angle)*radius
        );

        p.object.rotation.y=angle;
        p.object.rotation.z=-1.3+opening*.8;
        p.object.rotation.x=Math.sin(t+p.offset)*.12;

        p.object.scale.set(
          .22,
          .65+opening*.25,
          .09
        );
      });

      center.scale.setScalar(1+Math.sin(t*2)*.1);
      coreRing.rotation.z=t*.18;
      dust.rotation.y=t*.03;
    }
  };
}

/* =========================================
   03 — LIQUID UNIVERSE
   Animated shader sculpture
========================================= */

function liquidScene() {
  const group=new THREE.Group();

  const liquidMaterial=new THREE.ShaderMaterial({
    uniforms:{
      uTime:{value:0}
    },

    vertexShader:`
      uniform float uTime;
      varying vec3 vNormal;
      varying vec3 vPosition;

      void main() {
        vec3 p=position;
        float wave=
          sin(p.x*3.5+uTime*1.2)*0.12+
          sin(p.y*4.0-uTime)*0.10+
          cos(p.z*3.0+uTime*.8)*0.12;

        p+=normal*wave;

        vNormal=normalize(normalMatrix*normal);
        vPosition=(modelViewMatrix*vec4(p,1.0)).xyz;

        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
      }
    `,

    fragmentShader:`
      uniform float uTime;
      varying vec3 vNormal;
      varying vec3 vPosition;

      void main() {
        vec3 n=normalize(vNormal);
        vec3 viewDir=normalize(-vPosition);

        float fresnel=pow(1.0-max(dot(n,viewDir),0.0),2.5);

        float lines=sin(vPosition.y*8.0+uTime*1.8)*.5+.5;

        vec3 dark=vec3(.025,.023,.02);
        vec3 goldColor=vec3(.72,.49,.23);

        vec3 color=mix(dark,goldColor,fresnel*.9+lines*.16);

        float shine=pow(max(dot(reflect(-normalize(vec3(.5,1.0,1.0)),n),viewDir),0.0),18.0);

        color+=vec3(.8,.62,.34)*shine*.9;

        gl_FragColor=vec4(color,1.0);
      }
    `
  });

  const sphere=mesh(
    group,
    new THREE.IcosahedronGeometry(1.8,7),
    liquidMaterial
  );

  const rings=[];

  for(let i=0;i<5;i++) {
    const r=torus(group,2.5+i*.22,.012,i%2===0?gold:bronze);
    r.rotation.set(i*.7,i*.9,i*.3);
    rings.push(r);
  }

  const dust=particles(group,900,15,.018);

  return {
    group,
    update(t) {
      liquidMaterial.uniforms.uTime.value=t;
      sphere.rotation.y=t*.2;
      sphere.rotation.x=Math.sin(t*.4)*.25;

      rings.forEach((r,i)=>{
        r.rotation.x+=.001*(i+1);
        r.rotation.y+=.002*(i+1);
      });

      dust.rotation.y=-t*.025;
    }
  };
}

/* =========================================
   04 — PARTICLE SINGULARITY
   Black hole and orbital particles
========================================= */

function singularityScene() {
  const group=new THREE.Group();

  const blackHole=mesh(
    group,
    new THREE.SphereGeometry(1.15,48,48),
    new THREE.MeshBasicMaterial({color:0x000000})
  );

  const eventHorizon=torus(group,1.25,.045,glow);
  eventHorizon.rotation.x=.25;

  const disk=torus(group,2.0,.22,bronze);
  disk.rotation.x=.25;

  const count=7000;
  const positions=new Float32Array(count*3);
  const seeds=[];

  for(let i=0;i<count;i++) {
    const angle=Math.random()*Math.PI*2;
    const radius=1.5+Math.random()*3.8;

    seeds.push({
      angle,
      radius,
      speed:.15+Math.random()*.65,
      height:(Math.random()-.5)*.3
    });
  }

  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute(
    'position',
    new THREE.BufferAttribute(positions,3)
  );

  const material=new THREE.PointsMaterial({
    color:0xe1b56f,
    size:.024,
    transparent:true,
    opacity:.8,
    depthWrite:false
  });

  const stars=new THREE.Points(geometry,material);
  group.add(stars);

  const outer=torus(group,4.8,.009,gold);
  outer.rotation.x=1.25;

  return {
    group,
    update(t) {
      seeds.forEach((p,i)=>{
        const angle=p.angle+t*p.speed;
        const radius=p.radius+Math.sin(t*1.3+i)*.06;

        positions[i*3]=Math.cos(angle)*radius;
        positions[i*3+1]=p.height+Math.sin(angle*2+t)*.08;
        positions[i*3+2]=Math.sin(angle)*radius;
      });

      geometry.attributes.position.needsUpdate=true;

      blackHole.rotation.y=t*.12;
      disk.rotation.z=t*.12;
      eventHorizon.rotation.z=-t*.3;
      outer.rotation.z=t*.08;
    }
  };
}

/* =========================================
   05 — KINETIC SCULPTURE
   Interlocking rotating rings
========================================= */

function kineticScene() {
  const group=new THREE.Group();

  const assembly=new THREE.Group();
  group.add(assembly);

  const rings=[];

  for(let i=0;i<16;i++) {
    const ring=torus(
      assembly,
      1.3+(i%4)*.4,
      .025+(i%3)*.012,
      i%3===0?glow:i%2===0?gold:bronze
    );

    ring.rotation.set(
      i*.71,
      i*.42,
      i*.27
    );

    rings.push(ring);
  }

  const center=mesh(
    assembly,
    new THREE.DodecahedronGeometry(.8,2),
    blackMetal
  );

  const innerWire=mesh(
    assembly,
    new THREE.IcosahedronGeometry(1.1,2),
    new THREE.MeshBasicMaterial({
      color:0xc6a467,
      wireframe:true,
      transparent:true,
      opacity:.5
    })
  );

  const dust=particles(group,1200,18,.018);

  return {
    group,
    update(t) {
      rings.forEach((r,i)=>{
        r.rotation.x+=.0015*(i+1);
        r.rotation.y+=.001*(i+1);
        r.rotation.z+=.0008*(i+1);
      });

      center.rotation.x=t*.28;
      center.rotation.y=t*.34;
      innerWire.rotation.x=-t*.22;
      innerWire.rotation.y=t*.19;

      assembly.rotation.y=Math.sin(t*.25)*.3;
      dust.rotation.y=t*.02;
    }
  };
}

/* =========================================
   06 — GRAVITY ENGINE
   Orbital physics
========================================= */

function gravityScene() {
  const group=new THREE.Group();

  const core=mesh(
    group,
    new THREE.SphereGeometry(.55,48,48),
    new THREE.MeshBasicMaterial({color:0x000000})
  );

  const halo=torus(group,1.05,.045,glow);
  halo.rotation.x=.7;

  const orbiters=[];

  for(let i=0;i<8;i++) {
    const orbit=torus(group,1.6+i*.38,.008,bronze);
    orbit.rotation.set(i*.4,i*.8,i*.2);
    orbiters.push(orbit);
  }

  const count=4500;
  const positions=new Float32Array(count*3);
  const initial=[];

  for(let i=0;i<count;i++) {
    initial.push({
      radius:1.4+Math.random()*4,
      angle:Math.random()*Math.PI*2,
      speed:.12+Math.random()*.8,
      tilt:(Math.random()-.5)*.8
    });
  }

  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));

  const pts=new THREE.Points(
    geo,
    new THREE.PointsMaterial({
      color:0xc7a36a,
      size:.022,
      transparent:true,
      opacity:.75,
      depthWrite:false
    })
  );

  group.add(pts);

  return {
    group,
    update(t) {
      initial.forEach((p,i)=>{
        const radius=p.radius;
        const angle=p.angle+t*p.speed;

        positions[i*3]=Math.cos(angle)*radius;
        positions[i*3+1]=Math.sin(angle*2)*p.tilt;
        positions[i*3+2]=Math.sin(angle)*radius;
      });

      geo.attributes.position.needsUpdate=true;

      orbiters.forEach((r,i)=>{
        r.rotation.z=t*(.06+i*.018);
        r.rotation.x=Math.sin(t*.2+i)*.12;
      });

      halo.rotation.z=t*.35;
      core.rotation.y=t*.2;
    }
  };
}

/* =========================================
   07 — WAVE DIMENSION
   Mathematical wave field
========================================= */

function waveScene() {
  const group=new THREE.Group();

  const geometry=new THREE.PlaneGeometry(13,13,150,150);

  const material=new THREE.MeshStandardMaterial({
    color:0x79603b,
    metalness:.82,
    roughness:.26,
    wireframe:true,
    emissive:0x241708,
    emissiveIntensity:.45,
    side:THREE.DoubleSide
  });

  const surface=mesh(
    group,
    geometry,
    material
  );

  surface.rotation.x=-Math.PI/2.3;
  surface.position.y=-.4;

  const positions=geometry.attributes.position;
  const original=[];

  for(let i=0;i<positions.count;i++) {
    original.push({
      x:positions.getX(i),
      y:positions.getY(i),
      z:positions.getZ(i)
    });
  }

  const rings=[];

  for(let i=0;i<4;i++) {
    const r=torus(group,1.3+i*.7,.009,gold);
    r.rotation.x=Math.PI/2;
    r.position.y=-1.6+i*.18;
    rings.push(r);
  }

  return {
    group,
    update(t) {
      for(let i=0;i<positions.count;i++) {
        const p=original[i];

        const wave1=Math.sin(p.x*1.2+t*1.2);
        const wave2=Math.cos(p.z*1.4-t*.9);
        const wave3=Math.sin((p.x+p.z)*.7+t*.6);

        positions.setZ(
          i,
          p.z+wave1*.35+wave2*.25+wave3*.18
        );
      }

      positions.needsUpdate=true;
      geometry.computeVertexNormals();

      surface.rotation.z=Math.sin(t*.15)*.06;

      rings.forEach((r,i)=>{
        r.rotation.z=t*(.06+i*.02);
      });
    }
  };
}

/* =========================================
   08 — FRACTAL INFINITY
   Recursive geometric structure
========================================= */

function fractalScene() {
  const group=new THREE.Group();

  const fractal=new THREE.Group();
  group.add(fractal);

  function branch(parent,level,size,angle) {
    if(level<=0) return;

    const object=new THREE.Group();
    parent.add(object);

    const shape=mesh(
      object,
      new THREE.OctahedronGeometry(size,1),
      level%2===0?gold:blackMetal
    );

    shape.rotation.set(angle,angle*.7,angle*.4);

    const wire=mesh(
      object,
      new THREE.OctahedronGeometry(size*1.2,1),
      new THREE.MeshBasicMaterial({
        color:0xb78c4e,
        wireframe:true,
        transparent:true,
        opacity:.32
      })
    );

    object.userData.phase=angle;

    for(let i=0;i<4;i++) {
      const child=new THREE.Group();

      child.position.set(
        Math.cos(i*Math.PI/2)*size*1.55,
        Math.sin(i*Math.PI/2)*size*1.55,
        0
      );

      object.add(child);
      branch(child,level-1,size*.42,angle+i*.7);
    }

    object.userData.spin=level%2===0?1:-1;
    object.userData.shape=shape;
    object.userData.wire=wire;

    return object;
  }

  const root=branch(fractal,4,1.25,.4);

  const orbit1=torus(group,3.8,.012,gold);
  const orbit2=torus(group,4.5,.009,bronze);
  orbit1.rotation.x=.8;
  orbit2.rotation.y=1.1;

  const dust=particles(group,1000,18,.018);

  const nodes=[];
  fractal.traverse(o=>{
    if(o.userData.spin) nodes.push(o);
  });

  return {
    group,
    update(t) {
      fractal.rotation.y=t*.14;
      fractal.rotation.x=Math.sin(t*.3)*.2;

      nodes.forEach((n,i)=>{
        n.rotation.x=t*.15*n.userData.spin;
        n.rotation.y=t*.12*n.userData.spin;

        const pulse=1+Math.sin(t*1.2+i)*.035;
        n.scale.setScalar(pulse);
      });

      orbit1.rotation.z=t*.1;
      orbit2.rotation.x=t*.08;
      dust.rotation.y=t*.02;
    }
  };
}

/* =========================================
   SCENE MANAGER
========================================= */

const builders={
  geometry:geometryScene,
  bloom:bloomScene,
  liquid:liquidScene,
  singularity:singularityScene,
  kinetic:kineticScene,
  gravity:gravityScene,
  waves:waveScene,
  fractal:fractalScene
};

const sectionList=[
  ...document.querySelectorAll('.world-section[data-scene]')
];

const counter=document.getElementById('sceneNumber');

function loadScene(name,index) {
  if(name===activeScene) return;

  activeScene=name;
  resetGroup();

  const result=builders[name]();

  activeGroup.add(result.group);
  activeGroup.userData.update=result.update;

  activeGroup.scale.setScalar(.85);

  counter.textContent=String(index+1).padStart(2,'0');

  camera.position.set(0,0,10);
}

/* =========================================
   SCROLL OBSERVER
========================================= */

const observer=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting) {
      const index=sectionList.indexOf(entry.target);
      loadScene(entry.target.dataset.scene,index);
    }
  });
},{
  threshold:.45
});

sectionList.forEach(section=>observer.observe(section));

/* =========================================
   POINTER INTERACTION
========================================= */

window.addEventListener('pointermove',event=>{
  pointerX=(event.clientX/innerWidth-.5)*2;
  pointerY=(event.clientY/innerHeight-.5)*2;
},{passive:true});

/* =========================================
   ANIMATION LOOP
========================================= */

const clock=new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta=Math.min(clock.getDelta(),.04);
  elapsed+=delta;

  smoothX+=(pointerX-smoothX)*.025;
  smoothY+=(pointerY-smoothY)*.025;

  if(activeGroup.userData.update) {
    activeGroup.userData.update(elapsed);
  }

  activeGroup.scale.lerp(
    new THREE.Vector3(1,1,1),
    .025
  );

  camera.position.x+=(smoothX*.32-camera.position.x)*.025;
  camera.position.y+=(-smoothY*.24-camera.position.y)*.025;
  camera.lookAt(0,0,0);

  keyLight.position.x=Math.sin(elapsed*.35)*4;
  keyLight.position.y=Math.cos(elapsed*.4)*3;

  composer.render();
}

loadScene('geometry',0);
animate();

/* =========================================
   RESIZE
========================================= */

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

  composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth,innerHeight);
});

/* =========================================
   OPENING + MUSIC
========================================= */

const intro=document.getElementById('intro');
const main=document.getElementById('main');
const enter=document.getElementById('enter');
const music=document.getElementById('music');
const sound=document.getElementById('sound');
const soundLabel=document.getElementById('soundLabel');

music.volume=.38;

enter.addEventListener('click',async()=>{
  enter.disabled=true;
  enter.textContent='ENTERING THE UNIVERSE...';

  main.classList.add('show');
  document.body.classList.remove('intro-open');

  try {
    await music.play();
    sound.classList.add('playing');
    soundLabel.textContent='SOUND ON';
  } catch(error) {
    sound.classList.remove('playing');
    soundLabel.textContent='PLAY SOUND';
    console.warn('Music playback failed:',error);
  }

  intro.classList.add('exit');

  window.scrollTo({
    top:0,
    behavior:'instant'
  });
});

sound.addEventListener('click',async()=>{
  if(music.paused) {
    try {
      await music.play();
      sound.classList.add('playing');
      soundLabel.textContent='SOUND ON';
    } catch(error) {
      soundLabel.textContent='PLAY SOUND';
    }
  } else {
    music.pause();
    sound.classList.remove('playing');
    soundLabel.textContent='SOUND OFF';
  }
});

</script>
