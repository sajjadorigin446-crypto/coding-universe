
<!DOCTYPE html>

<style>
:root {
  --bg:#050509;
  --white:#f5f5f7;
  --muted:rgba(255,255,255,.48);
}
* { box-sizing:border-box; }
html {
  margin:0;
  width:100%;
  scroll-behavior:auto;
  background:var(--bg);
}
body {
  margin:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--white);
  font-family:Inter,Arial,sans-serif;
}
body.locked { overflow:hidden; }

#visual {
  position:fixed;
  inset:0;
  z-index:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
#visual canvas {
  display:block;
  width:100%;
  height:100%;
}
#grain {
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;
  opacity:.11;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
}
#vignette {
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.42) 100%);
}
#intro {
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:#030308;
  transition:opacity 1.2s ease, visibility 1.2s ease;
}
#intro.hide {
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.intro-space {
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 52%,rgba(57,45,112,.25),transparent 40%),
    radial-gradient(ellipse at 50% 100%,rgba(0,177,210,.10),transparent 50%),
    #030308;
}
.intro-space:before,
.intro-space:after {
  content:"";
  position:absolute;
  width:min(76vw,650px);
  aspect-ratio:1;
  left:50%;
  top:48%;
  border-radius:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(160,133,255,.24);
  box-shadow:0 0 60px rgba(90,90,255,.13),inset 0 0 60px rgba(0,220,255,.08);
  animation:portal 18s linear infinite;
}
.intro-space:after {
  width:min(57vw,490px);
  border-color:rgba(0,220,255,.26);
  box-shadow:0 0 70px rgba(0,220,255,.12),inset 0 0 55px rgba(170,80,255,.1);
  animation:portal 12s linear infinite reverse;
}
@keyframes portal {
  from { transform:translate(-50%,-50%) rotateX(65deg) rotateZ(0deg) scale(1); }
  to { transform:translate(-50%,-50%) rotateX(65deg) rotateZ(360deg) scale(1); }
}
.portal-core {
  position:absolute;
  left:50%;
  top:48%;
  width:min(34vw,280px);
  aspect-ratio:1;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, #020207 0 23%,#17112e 30%,#5c36a0 34%,#00b8d4 37%,#19142e 41%,transparent 66%);
  filter:blur(2px);
  box-shadow:0 0 90px rgba(0,180,255,.24),0 0 150px rgba(143,60,255,.2);
  animation:corePulse 5s ease-in-out infinite alternate;
}
@keyframes corePulse {
  from { transform:translate(-50%,-50%) scale(.9); filter:hue-rotate(0deg) blur(2px); }
  to { transform:translate(-50%,-50%) scale(1.12); filter:hue-rotate(45deg) blur(5px); }
}
.intro-orbit {
  position:absolute;
  left:50%;
  top:48%;
  width:min(90vw,850px);
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,255,255,.08);
  border-radius:50%;
  animation:orbit 30s linear infinite;
}
.intro-orbit:before,.intro-orbit:after {
  content:"";
  position:absolute;
  width:8px;height:8px;border-radius:50%;
  background:#b9a2ff;
  box-shadow:0 0 25px 8px rgba(145,100,255,.65);
  top:15%;left:19%;
}
.intro-orbit:after {
  width:5px;height:5px;
  background:#65eaff;
  box-shadow:0 0 25px 8px rgba(0,220,255,.5);
  top:75%;left:78%;
}
@keyframes orbit { to { transform:translate(-50%,-50%) rotate(360deg); } }
.intro-content {
  position:relative;
  z-index:2;
  text-align:center;
  width:100%;
  padding:24px;
  margin-top:190px;
}
.intro-kicker {
  font-size:10px;
  letter-spacing:.48em;
  color:rgba(255,255,255,.52);
  margin-bottom:20px;
}
.intro-title {
  font-size:clamp(34px,7.2vw,88px);
  line-height:.98;
  letter-spacing:-.075em;
  font-weight:800;
  margin:0 auto;
  max-width:1000px;
  background:linear-gradient(110deg,#fff 5%,#9deaff 35%,#c3a4ff 65%,#fff 95%);
  color:transparent;
  background-clip:text;
  -webkit-background-clip:text;
  text-shadow:0 0 60px rgba(130,130,255,.15);
}
.intro-tagline {
  margin:22px 0 32px;
  font-size:10px;
  letter-spacing:.42em;
  color:rgba(255,255,255,.62);
}
.enter {
  border:1px solid rgba(255,255,255,.42);
  background:rgba(255,255,255,.04);
  color:white;
  padding:16px 28px;
  border-radius:50px;
  font-size:10px;
  letter-spacing:.22em;
  font-weight:600;
  cursor:pointer;
  backdrop-filter:blur(12px);
  transition:.35s ease;
}
.enter:hover {
  background:white;
  color:#050509;
  box-shadow:0 0 40px rgba(120,170,255,.3);
  transform:translateY(-3px);
}
.intro-bottom {
  position:absolute;
  bottom:28px;
  left:0;right:0;
  text-align:center;
  color:rgba(255,255,255,.3);
  font-size:9px;
  letter-spacing:.3em;
}
#experience {
  position:relative;
  z-index:1;
  opacity:0;
  transition:opacity 1.2s ease;
}
#experience.ready { opacity:1; }
.scene-section {
  position:relative;
  height:100svh;
  min-height:620px;
  width:100%;
  pointer-events:none;
}
.hud {
  position:fixed;
  z-index:5;
  top:25px;
  left:25px;
  right:25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
  opacity:0;
  transition:opacity .8s ease;
}
.hud.visible { opacity:1; }
.brand {
  font-size:9px;
  letter-spacing:.28em;
  color:rgba(255,255,255,.58);
  font-weight:600;
}
.hud-right {
  display:flex;
  align-items:center;
  gap:18px;
}
#counter {
  font-size:10px;
  letter-spacing:.2em;
  color:rgba(255,255,255,.6);
}
#sound {
  pointer-events:auto;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.2);
  color:white;
  border-radius:50px;
  padding:9px 13px;
  font-size:9px;
  letter-spacing:.14em;
  cursor:pointer;
  backdrop-filter:blur(12px);
}
.scroll-hint {
  position:fixed;
  z-index:5;
  bottom:26px;
  left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,.4);
  font-size:9px;
  letter-spacing:.25em;
  pointer-events:none;
  opacity:0;
  transition:opacity .8s;
}
.scroll-hint.visible { opacity:1; }
.scroll-hint:after {
  content:"";
  display:block;
  width:1px;height:25px;
  background:linear-gradient(white,transparent);
  margin:12px auto 0;
}
@media(max-width:600px) {
  .intro-content { margin-top:145px; }
  .intro-kicker { font-size:8px; letter-spacing:.32em; }
  .intro-title { font-size:clamp(35px,10vw,58px); }
  .intro-tagline { font-size:8px; letter-spacing:.24em; }
  .enter { padding:14px 22px; font-size:9px; }
  .hud { top:17px;left:15px;right:15px; }
  .brand { font-size:8px;letter-spacing:.16em; }
  .hud-right { gap:10px; }
  #counter { font-size:9px; }
  #sound { padding:8px 10px;font-size:8px; }
  .scene-section { min-height:560px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*:before,*:after { animation-duration:.01ms!important; }
}
</style>
</head>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';
import { gsap } from 'https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js';
import { ScrollTrigger } from 'https://cdn.jsdelivr.net/npm/gsap@3.12.5/ScrollTrigger.js';

gsap.registerPlugin(ScrollTrigger);

const visual = document.getElementById('visual');
const sections = [...document.querySelectorAll('.scene-section')];
const counter = document.getElementById('counter');
const intro = document.getElementById('intro');
const experience = document.getElementById('experience');
const hud = document.getElementById('hud');
const soundBtn = document.getElementById('sound');
const music = document.getElementById('music');

const isMobile = matchMedia('(max-width: 700px)').matches;
const pixelRatio = Math.min(devicePixelRatio || 1, isMobile ? 1.35 : 1.8);

const renderer = new THREE.WebGLRenderer({
  antialias: !isMobile,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
visual.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050509);
scene.fog = new THREE.FogExp2(0x050509, 0.035);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, .1, 150);
camera.position.set(0,0,10);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth,innerHeight),
  isMobile ? .55 : .85,
  .65,
  .18
);
composer.addPass(bloom);

const ambient = new THREE.AmbientLight(0xffffff,1.1);
scene.add(ambient);
const keyLight = new THREE.PointLight(0xffffff,90,50);
keyLight.position.set(5,6,8);
scene.add(keyLight);
const rimLight = new THREE.PointLight(0x547bff,100,45);
rimLight.position.set(-6,-3,-4);
scene.add(rimLight);

const world = new THREE.Group();
scene.add(world);

let active = -1;
let currentPalette = [0x7b61ff,0x00d9ff,0xffffff];
let sceneClock = 0;
let scrollProgress = 0;
let transition = 0;
let isSound = true;
let sceneObjects = [];

const palettes = [
 [0x6f5bff,0x00d8ff,0xf5e9ff],
 [0xff66b3,0xffc0e8,0x8e65ff],
 [0x00d9ff,0x087dff,0xffffff],
 [0xff8b52,0xffd16c,0xff4f87],
 [0xb6ffed,0x52a9ff,0xffffff],
 [0xc28aff,0x6a4bff,0xf5eaff],
 [0xffe6a6,0xff8b58,0xffffff],
 [0x7bffb2,0x2f9e83,0xd5fff1],
 [0x9ca8ff,0x5660ff,0xffffff],
 [0xff7b7b,0xffc0a0,0xffffff],
 [0x5ef0ff,0x6d7cff,0xe7faff],
 [0xe0a0ff,0xff80c0,0xffffff],
 [0xa9ff78,0x21c9a2,0xffffff],
 [0xffc76a,0xff6a9f,0xeee0ff],
 [0x86d8ff,0x8c76ff,0xffffff],
 [0xf4f4f4,0x9b9b9b,0xffffff],
 [0xffa9dc,0x9e77ff,0xffffff],
 [0x78ffe2,0x3c8dff,0xffffff],
 [0xffd27a,0xff765e,0xffffff],
 [0x91a5ff,0xc9e7ff,0xffffff],
 [0xff83ad,0x9d6dff,0xffffff],
 [0x79e6ff,0xffd36e,0xffffff],
 [0xc5ff8e,0x76baff,0xffffff],
 [0xffa36d,0xb27bff,0xffffff],
 [0xa4a9ff,0x52e6ff,0xffffff]
];

function mat(color, metalness=.35, roughness=.25, emissive=0x000000) {
  return new THREE.MeshPhysicalMaterial({
    color, metalness, roughness, emissive,
    emissiveIntensity: .32,
    clearcoat:.8,
    clearcoatRoughness:.15
  });
}
function addMesh(geo,material,x=0,y=0,z=0,rx=0,ry=0,rz=0) {
  const m = new THREE.Mesh(geo,material);
  m.position.set(x,y,z);
  m.rotation.set(rx,ry,rz);
  world.add(m);
  sceneObjects.push(m);
  return m;
}
function addLine(points,color,opacity=.7) {
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const line = new THREE.Line(geo,new THREE.LineBasicMaterial({
    color,transparent:true,opacity
  }));
  world.add(line);
  sceneObjects.push(line);
  return line;
}
function particles(count,color,size=.035,spread=8,mode='random') {
  const arr = new Float32Array(count*3);
  for(let i=0;i<count;i++) {
    let x,y,z;
    if(mode==='sphere') {
      const u=Math.random()*Math.PI*2;
      const v=Math.acos(2*Math.random()-1);
      const r=spread*(.55+Math.random()*.45);
      x=r*Math.sin(v)*Math.cos(u);
      y=r*Math.sin(v)*Math.sin(u);
      z=r*Math.cos(v);
    } else if(mode==='ring') {
      const a=Math.random()*Math.PI*2;
      const r=spread*(.65+Math.random()*.35);
      x=Math.cos(a)*r;
      y=(Math.random()-.5)*1.3;
      z=Math.sin(a)*r;
    } else {
      x=(Math.random()-.5)*spread*2;
      y=(Math.random()-.5)*spread*2;
      z=(Math.random()-.5)*spread*2;
    }
    arr[i*3]=x;arr[i*3+1]=y;arr[i*3+2]=z;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const points=new THREE.Points(geo,new THREE.PointsMaterial({
    color,size,transparent:true,opacity:.85,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  }));
  world.add(points);
  sceneObjects.push(points);
  return points;
}
function clearWorld() {
  while(world.children.length) {
    const obj=world.children[0];
    world.remove(obj);
    obj.traverse?.(child=>{
      if(child.geometry) child.geometry.dispose();
      if(child.material) {
        if(Array.isArray(child.material)) child.material.forEach(m=>m.dispose());
        else child.material.dispose();
      }
    });
  }
  sceneObjects=[];
}
function glowLights(p) {
  keyLight.color.setHex(p[0]);
  rimLight.color.setHex(p[1]);
  scene.background.setHex(0x050509);
  scene.fog.color.setHex(0x050509);
}

function scene01() {
  particles(isMobile?900:2200,0x8d9cff,.035,10,'sphere');
  const core=addMesh(new THREE.IcosahedronGeometry(1.45,2),mat(0xaaaaff,.8,.12,0x4030ff));
  const wire=addMesh(new THREE.IcosahedronGeometry(2.1,1),new THREE.MeshBasicMaterial({color:0x5eeaff,wireframe:true,transparent:true,opacity:.45}));
  const rings=[];
  for(let i=0;i<5;i++) {
    const r=addMesh(new THREE.TorusGeometry(2.7+i*.24,.012,8,180),new THREE.MeshBasicMaterial({color:i%2?0x00dfff:0x9878ff}));
    r.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);rings.push(r);
  }
  return t=>{core.rotation.y=t*.4;wire.rotation.x=t*.25;wire.rotation.y=-t*.2;rings.forEach((r,i)=>r.rotation.z=t*(.12+i*.025));};
}
function scene02() {
  const group=new THREE.Group();world.add(group);
  for(let i=0;i<64;i++) {
    const a=i*Math.PI*2/64;
    const petal=addMesh(new THREE.SphereGeometry(1,20,16),mat(i%2?0xff75bd:0xc18bff,.3,.2,0x501050));
    petal.scale.set(.32,1.25,.12);
    petal.position.set(Math.cos(a)*1.25,Math.sin(a)*1.25,Math.sin(i*.3)*.2);
    petal.rotation.z=a-Math.PI/2;
  }
  const center=addMesh(new THREE.SphereGeometry(.48,32,32),mat(0xffe1a6,.5,.18,0x9d5a19));
  particles(700,0xffa6db,.025,5,'sphere');
  return t=>{world.rotation.z=t*.12;world.rotation.y=Math.sin(t*.3)*.25;center.scale.setScalar(1+Math.sin(t*2)*.08);};
}
function scene03() {
  const g=new THREE.TorusKnotGeometry(1.7,.48,240,24,2,5);
  const a=addMesh(g,mat(0x00d8ff,.85,.12,0x004c66));
  const w=addMesh(new THREE.TorusKnotGeometry(2.1,.018,300,8,3,7),new THREE.MeshBasicMaterial({color:0x9c76ff}));
  particles(1100,0x9aefff,.025,7);
  return t=>{a.rotation.x=t*.3;a.rotation.y=t*.45;w.rotation.x=-t*.2;w.rotation.z=t*.3;};
}
function scene04() {
  const disk=addMesh(new THREE.TorusGeometry(2.5,.5,32,180),mat(0xff8b52,.7,.16,0x9a2600));
  disk.scale.y=.25;
  const core=addMesh(new THREE.SphereGeometry(.8,48,48),new THREE.MeshBasicMaterial({color:0x03030a}));
  for(let i=0;i<6;i++) {
    const ring=addMesh(new THREE.TorusGeometry(1.4+i*.35,.018,8,150),new THREE.MeshBasicMaterial({color:i%2?0xffd06a:0xff5e8c}));
    ring.rotation.x=Math.PI/2+Math.random()*.5;
  }
  particles(1800,0xffad75,.025,7,'ring');
  return t=>{disk.rotation.z=t*.3;disk.rotation.x=Math.sin(t*.2)*.2;world.rotation.y=t*.08;};
}
function scene05() {
  const geo=new THREE.PlaneGeometry(12,12,90,90);
  const pos=geo.attributes.position;
  const original=pos.array.slice();
  const mesh=addMesh(geo,new THREE.MeshPhysicalMaterial({color:0x69e8ff,wireframe:true,metalness:.4,roughness:.2,emissive:0x075577}));
  mesh.rotation.x=-Math.PI/2.5;
  return t=>{
    for(let i=0;i<pos.count;i++) {
      const x=original[i*3],y=original[i*3+1];
      pos.setZ(i,Math.sin(x*1.2+t*1.6)*.35+Math.cos(y*1.4-t)*.3);
    }
    pos.needsUpdate=true;geo.computeVertexNormals();mesh.rotation.z=t*.04;
  };
}
function scene06() {
  const group=new THREE.Group();world.add(group);
  for(let i=0;i<22;i++) {
    const m=addMesh(new THREE.OctahedronGeometry(.7+Math.random()*.5,0),mat(i%2?0x9e83ff:0x66eaff,.8,.12));
    m.position.set((Math.random()-.5)*5,(Math.random()-.5)*5,(Math.random()-.5)*4);
    m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  }
  particles(1000,0xb7aaff,.025,8);
  return t=>{world.rotation.y=t*.12;world.rotation.x=Math.sin(t*.2)*.15;};
}
function scene07() {
  const core=addMesh(new THREE.SphereGeometry(.7,32,32),mat(0x8bffce,.5,.15,0x146c4a));
  for(let i=0;i<9;i++) {

  for(let i=0;i<12;i++) {

const builders=[
 scene01,scene02,scene03,scene04,scene05,
 scene06,scene07,scene08,scene09,scene10,
 scene11,scene12,scene13,scene14,scene15,
 scene16,scene17,scene18,scene19,scene20,
 scene21,scene22,scene23,scene24,scene25
];

let animateScene=()=>{};
function loadScene(index) {
  if(index===active) return;
  active=index;
  clearWorld();
  currentPalette=palettes[index];
  glowLights(currentPalette);
  animateScene=builders[index]();
  counter.textContent=String(index+1).padStart(2,'0')+' / 25';
  gsap.fromTo(world.scale,{x:.82,y:.82,z:.82},{x:1,y:1,z:1,duration:1.5,ease:'power3.out'});
  gsap.fromTo(camera.position,{z:12},{z:9.5,duration:1.5,ease:'power3.out'});
  transition=0;
  gsap.to({v:0},{v:1,duration:1.4,ease:'power2.out',onUpdate:function(){transition=this.targets()[0].v;}});
}

sections.forEach((section,index)=>{
  ScrollTrigger.create({
    trigger:section,
    start:'top 55%',
    end:'bottom 45%',
    onEnter:()=>loadScene(index),
    onEnterBack:()=>loadScene(index)
  });
  ScrollTrigger.create({
    trigger:section,
    start:'top bottom',
    end:'bottom top',
    onUpdate:self=>{
      if(index===active) {
        scrollProgress=self.progress;
      }
    }
  });
});

let lastTime=0;
function render(time) {
  requestAnimationFrame(render);
  const dt=Math.min((time-lastTime)/1000,.05);
  lastTime=time;
  sceneClock+=dt;
  if(active>=0) {
    animateScene(sceneClock);
    world.rotation.y += dt*.018;
    world.position.y=Math.sin(sceneClock*.35)*.08;
    camera.position.x=gsap.utils.interpolate(camera.position.x,Math.sin(scrollProgress*Math.PI*2)*.25,.025);
    camera.position.y=gsap.utils.interpolate(camera.position.y,Math.cos(scrollProgress*Math.PI*2)*.18,.025);
    camera.lookAt(0,0,0);
  }
  composer.render();
}
requestAnimationFrame(render);

document.getElementById('enter').addEventListener('click',async()=>{
  intro.classList.add('hide');
  document.body.classList.remove('locked');
  experience.classList.add('ready');
  hud.classList.add('visible');
  document.getElementById('scrollHint').classList.add('visible');

  if(isSound) {
    try {
      music.volume=.55;
      await music.play();
      soundBtn.textContent='SOUND ON';
    } catch(e) {
      soundBtn.textContent='SOUND OFF';
    }
  }
  setTimeout(()=>{
    window.scrollTo({top:0,behavior:'auto'});
    ScrollTrigger.refresh();
    loadScene(0);
  },250);
});

soundBtn.addEventListener('click',async()=>{
  if(music.paused) {
    try {
      await music.play();
      soundBtn.textContent='SOUND ON';
    } catch(e) {
      soundBtn.textContent='SOUND OFF';
    }
  } else {
    music.pause();
    soundBtn.textContent='SOUND OFF';
  }
});

function resize() {
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,isMobile?1.35:1.8));
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
  bloom.setSize(innerWidth,innerHeight);
  ScrollTrigger.refresh();
}
addEventListener('resize',resize);
</script>
